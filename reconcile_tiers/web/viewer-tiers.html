<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tier Viewer</title>
  <link rel="stylesheet" href="./viewer-tiers.css">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <aside>
    <header>
      <h1>Buildings by complexity</h1>
      <input id="search" placeholder="Address, UUID, or locator ID" autocomplete="off">
    </header>
    <div id="sidebar-stats">Loading...</div>
    <div id="list"></div>
  </aside>
  <main>
    <div id="top-bar">
      <button class="nav-btn" id="nav-prev" title="Previous building">↑</button>
      <button class="nav-btn" id="nav-next" title="Next building">↓</button>
      <div id="current">
        <div id="current-address">Loading tier payloads...</div>
        <div id="current-meta"></div>
      </div>
      <div id="pill">-</div>
    </div>
    <div id="signals"></div>
    <canvas id="view"></canvas>
    <div id="loading" class="hidden">Loading...</div>
    <div id="status">Click a mesh to inspect it. Right-click to copy its locator ID.</div>
  </main>
  <script type="module" src="./viewer-tiers-main.js"></script>

</body>
</html>
