<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Building 3D Viewer - Reconciliation Pipeline</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; color:#ddd; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; overflow:hidden; display:flex; }

#sidebar {
  width:280px; min-width:280px; height:100vh; background:#0d0d1a;
  border-right:1px solid #222; display:flex; flex-direction:column; z-index:20;
}
#sidebar-header { padding:12px; border-bottom:1px solid #222; }
#sidebar-header h1 { font-size:15px; font-weight:600; margin-bottom:8px; }
#search { width:100%; padding:6px 10px; border-radius:6px; border:1px solid #333; background:#1a1a2e; color:#ddd; font-size:12px; outline:none; }
#search:focus { border-color:#3a3aff; }
#search::placeholder { color:#555; }
#sidebar-stats { padding:6px 12px; font-size:10px; color:#555; border-bottom:1px solid #1a1a2a; }
#building-list { flex:1; overflow-y:auto; }
#building-list::-webkit-scrollbar { width:6px; }
#building-list::-webkit-scrollbar-track { background:#0d0d1a; }
#building-list::-webkit-scrollbar-thumb { background:#333; border-radius:3px; }

.bldg-item {
  padding:8px 12px; cursor:pointer; border-bottom:1px solid #1a1a2a;
  transition:background .12s;
}
.bldg-item:hover { background:#1a1a2e; }
.bldg-item.active { background:#1a1a3e; border-left:3px solid #3a3aff; }
.bldg-addr { font-size:12px; font-weight:500; line-height:1.3; color:#ccc; }
.bldg-meta { font-size:10px; color:#666; margin-top:2px; display:flex; gap:6px; }
.bldg-meta .tag { padding:1px 5px; border-radius:3px; font-size:9px; font-weight:600; }
.tag-GREEN { background:#1a3a1a; color:#4c4; }
.tag-YELLOW { background:#3a3a1a; color:#cc4; }
.tag-RED { background:#3a1a1a; color:#c44; }
.tag-UNKNOWN { background:#2a2a2a; color:#888; }
.stories-badge { color:#888; }
.stories-badge.multi { color:#4ecdc4; }

#viewport { flex:1; position:relative; }
#controls-bar {
  position:absolute; top:0; left:0; right:0; z-index:10;
  padding:10px 14px; display:flex; align-items:center; gap:16px;
  background:linear-gradient(to bottom, rgba(0,0,0,.7) 0%, transparent 100%);
  pointer-events:none;
}
#controls-bar > * { pointer-events:auto; }
.toggle-row { display:flex; gap:14px; font-size:11px; }
.toggle-row label { cursor:pointer; display:flex; align-items:center; gap:4px; white-space:nowrap; }
.toggle-row input { accent-color:#3a3aff; }
#legend-box { font-size:10px; line-height:1.8; }
#legend-box span { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:middle; margin-right:3px; }

#building-info {
  position:absolute; bottom:10px; left:10px; right:10px;
  font-size:11px; color:#666; z-index:10;
}
canvas { display:block; width:100%; height:100%; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>Building 3D Viewer</h1>
    <input type="text" id="search" placeholder="Search address or UUID...">
  </div>
  <div id="sidebar-stats"></div>
  <div id="building-list"></div>
</div>

<div id="viewport">
  <div id="controls-bar">
    <div class="toggle-row">
      <label><input type="checkbox" id="show-merged"> Merged</label>
      <label><input type="checkbox" id="show-raw" checked> Raw walls</label>
      <label><input type="checkbox" id="show-floors" checked> Floors</label>
      <label><input type="checkbox" id="show-wireframe"> Wireframe</label>
      <label><input type="checkbox" id="color-by-story" checked> Color by story</label>
      <label><input type="checkbox" id="show-gaps"> Cross-floor gaps</label>
    </div>
    <div id="legend-box"></div>
  </div>
  <div id="building-info"></div>
  <canvas id="c"></canvas>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const viewport = document.getElementById('viewport');
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setClearColor(0x111111);

function resizeRenderer() {
  const w = viewport.clientWidth, h = viewport.clientHeight;
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
camera.position.set(10, 15, 10);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dl1 = new THREE.DirectionalLight(0xffffff, 0.7);
dl1.position.set(10, 20, 10);
scene.add(dl1);
const dl2 = new THREE.DirectionalLight(0xffffff, 0.3);
dl2.position.set(-10, 10, -10);
scene.add(dl2);

const grid = new THREE.GridHelper(60, 60, 0x222233, 0x1a1a2a);
scene.add(grid);

const STORY_COLORS = [
  0xff6b6b, 0x4ecdc4, 0xf7dc6f, 0xbb8fce, 0x82e0aa, 0x45b7d1,
];
const STORY_WALL_COLORS = [
  0xcc4444, 0x339999, 0xccaa33, 0x8855aa, 0x559966, 0x338899,
];
const ROOM_COLORS = [
  0xff6b6b, 0x4ecdc4, 0x45b7d1, 0xf7dc6f, 0xbb8fce,
  0x82e0aa, 0xf0b27a, 0xaed6f1, 0xd7bde2, 0xa3e4d7,
  0xf5b7b1, 0x85c1e9, 0xfad7a0, 0xd5f5e3, 0xe8daef,
];
const MERGED_COLOR = 0x4488ff;
const MERGED_EDGE = 0x6699ff;

let colorByStory = true;
let DATA = [];
let currentBuilding = 0;
let groups = {
  merged: new THREE.Group(),
  raw: new THREE.Group(),
  floors: new THREE.Group(),
  gaps: new THREE.Group(),
};
scene.add(groups.merged);
scene.add(groups.raw);
scene.add(groups.floors);
scene.add(groups.gaps);
groups.merged.visible = false;
groups.gaps.visible = false;

function triangulateFan(corners) {
  const tris = [];
  for (let i = 1; i < corners.length - 1; i++) {
    tris.push(corners[0], corners[i], corners[i + 1]);
  }
  return tris;
}

function createPolygonMesh(corners, color, opacity) {
  const tris = triangulateFan(corners);
  const verts = new Float32Array(tris.length * 3);
  for (let i = 0; i < tris.length; i++) {
    verts[i*3] = tris[i][0]; verts[i*3+1] = tris[i][1]; verts[i*3+2] = tris[i][2];
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color, opacity, transparent: true, side: THREE.DoubleSide, depthWrite: false,
  }));
}

function createEdgeLoop(corners, color) {
  const pts = corners.map(c => new THREE.Vector3(c[0], c[1], c[2]));
  pts.push(pts[0]);
  return new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color })
  );
}

function disposeGroup(g) {
  while (g.children.length) {
    const c = g.children[0];
    if (c.geometry) c.geometry.dispose();
    if (c.material) c.material.dispose();
    g.remove(c);
  }
}

function addWalls(group, walls, color, edgeColor, opacity) {
  for (const w of walls) {
    if (w.corners.length >= 3) {
      group.add(createPolygonMesh(w.corners, color, opacity));
      group.add(createEdgeLoop(w.corners, edgeColor));
    }
  }
}

function loadBuilding(index) {
  currentBuilding = index;
  [groups.merged, groups.raw, groups.floors, groups.gaps].forEach(disposeGroup);

  const bldg = DATA[index];

  const allCorners = bldg.rooms.flatMap(r =>
    (r.walls_raw.length > 0 ? r.walls_raw : r.walls_merged).flatMap(w => w.corners)
  );
  let cx = 0, cy = 0, cz = 0;
  for (const c of allCorners) { cx += c[0]; cy += c[1]; cz += c[2]; }
  if (allCorners.length > 0) { cx /= allCorners.length; cy /= allCorners.length; cz /= allCorners.length; }

  const storySet = new Set(bldg.rooms.map(r => r.story));

  bldg.rooms.forEach((room, ri) => {
    const story = room.story || 0;
    const floorColor = colorByStory ? STORY_COLORS[story % STORY_COLORS.length] : ROOM_COLORS[ri % ROOM_COLORS.length];
    const wallColor = colorByStory ? STORY_WALL_COLORS[story % STORY_WALL_COLORS.length] : 0x44aa88;
    const wallEdge = colorByStory ? STORY_COLORS[story % STORY_COLORS.length] : 0x66ccaa;

    addWalls(groups.merged, room.walls_merged, MERGED_COLOR, MERGED_EDGE, 0.4);
    addWalls(groups.raw, room.walls_raw, wallColor, wallEdge, 0.5);

    if (room.floor_polygon && room.floor_polygon.length >= 3) {
      groups.floors.add(createPolygonMesh(room.floor_polygon, floorColor, 0.4));
      groups.floors.add(createEdgeLoop(room.floor_polygon, floorColor));
    }
  });

  // Cross-floor gap regions
  const GAP_COLORS = { high: 0xff00ff, medium: 0xcc44ff, low: 0x8866ff };
  const GAP_OPACITIES = { high: 0.55, medium: 0.4, low: 0.25 };
  const gapList = bldg.cross_floor_gaps || [];
  for (const gap of gapList) {
    if (gap.corners && gap.corners.length >= 3) {
      const col = GAP_COLORS[gap.confidence] || 0xff2222;
      const opa = GAP_OPACITIES[gap.confidence] || 0.3;
      groups.gaps.add(createPolygonMesh(gap.corners, col, opa));
      groups.gaps.add(createEdgeLoop(gap.corners, col));
    }
  }

  // Legend
  const legendBox = document.getElementById('legend-box');
  let html = '';
  if (colorByStory) {
    for (const s of [...storySet].sort()) {
      const c = STORY_COLORS[s % STORY_COLORS.length].toString(16).padStart(6, '0');
      html += `<span style="background:#${c}"></span>S${s} `;
    }
  }
  legendBox.innerHTML = html;

  // Info
  const rawCount = bldg.rooms.reduce((s, r) => s + r.walls_raw.length, 0);
  const mergedCount = bldg.rooms.reduce((s, r) => s + r.walls_merged.length, 0);
  const addr = bldg.address || bldg.uuid;
  const gapHigh = gapList.filter(g => g.confidence === 'high').length;
  const gapMed = gapList.filter(g => g.confidence === 'medium').length;
  const gapInfo = gapList.length > 0 ? ` &middot; gaps: ${gapHigh}h/${gapMed}m/${gapList.length - gapHigh - gapMed}l` : '';
  document.getElementById('building-info').innerHTML =
    `${addr} &middot; ${bldg.rooms.length} rooms &middot; ` +
    `${bldg.stories_found} stories &middot; ${rawCount} raw / ${mergedCount} merged walls${gapInfo}`;

  // Camera
  let maxDist = 5;
  for (const p of allCorners) {
    const d = Math.hypot(p[0]-cx, p[1]-cy, p[2]-cz);
    if (d > maxDist) maxDist = d;
  }
  const cd = maxDist * 1.8;
  camera.position.set(cx + cd*0.7, cy + cd*0.9, cz + cd*0.7);
  controls.target.set(cx, cy, cz);
  controls.update();

  // Highlight sidebar (only scroll for keyboard nav, not clicks)
  document.querySelectorAll('.bldg-item').forEach(el => {
    el.classList.toggle('active', Number(el.dataset.index) === index);
  });
  document.title = `${addr} - 3D Viewer`;
}

// Sidebar search
const searchInput = document.getElementById('search');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase();
  document.querySelectorAll('.bldg-item').forEach(el => {
    const text = el.dataset.search;
    el.style.display = text.includes(q) ? '' : 'none';
  });
  // Update visible count
  const visible = document.querySelectorAll('.bldg-item:not([style*="display: none"])').length;
  document.getElementById('sidebar-stats').textContent = q ? `${visible} / ${DATA.length} buildings` : `${DATA.length} buildings`;
});

// Keyboard nav
document.addEventListener('keydown', e => {
  if (e.target === searchInput) return;
  if (e.key === 'ArrowDown' || e.key === 'j') {
    e.preventDefault();
    const visible = [...document.querySelectorAll('.bldg-item:not([style*="display: none"])')];
    const curIdx = visible.findIndex(el => el.classList.contains('active'));
    if (curIdx < visible.length - 1) { visible[curIdx + 1]?.click(); visible[curIdx + 1]?.scrollIntoView({ block: 'nearest' }); }
  }
  if (e.key === 'ArrowUp' || e.key === 'k') {
    e.preventDefault();
    const visible = [...document.querySelectorAll('.bldg-item:not([style*="display: none"])')];
    const curIdx = visible.findIndex(el => el.classList.contains('active'));
    if (curIdx > 0) { visible[curIdx - 1]?.click(); visible[curIdx - 1]?.scrollIntoView({ block: 'nearest' }); }
  }
});

document.getElementById('show-merged').addEventListener('change', e => groups.merged.visible = e.target.checked);
document.getElementById('show-raw').addEventListener('change', e => groups.raw.visible = e.target.checked);
document.getElementById('show-floors').addEventListener('change', e => groups.floors.visible = e.target.checked);
document.getElementById('show-wireframe').addEventListener('change', e => {
  [groups.merged, groups.raw].forEach(g => {
    g.traverse(c => { if (c.isMesh) c.material.wireframe = e.target.checked; });
  });
});
document.getElementById('color-by-story').addEventListener('change', e => {
  colorByStory = e.target.checked;
  loadBuilding(currentBuilding);
});
document.getElementById('show-gaps').addEventListener('change', e => groups.gaps.visible = e.target.checked);

window.addEventListener('resize', resizeRenderer);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

fetch('buildings_3d.json')
  .then(r => r.json())
  .then(data => {
    DATA = data;

    // Sort by address
    const indices = data.map((b, i) => i);
    indices.sort((a, b) => (data[a].address || '').localeCompare(data[b].address || ''));

    const list = document.getElementById('building-list');
    for (const i of indices) {
      const b = data[i];
      const el = document.createElement('div');
      el.className = 'bldg-item';
      const addr = b.address || b.uuid.slice(0, 12);
      const rawCount = b.rooms.reduce((s, r) => s + r.walls_raw.length, 0);
      const cls = b.classification || 'UNKNOWN';
      const storiesClass = b.stories_found > 1 ? 'multi' : '';
      const gapCount = (b.cross_floor_gaps || []).length;
      const gapBadge = gapCount > 0 ? `<span style="color:#f84">${gapCount}gaps</span>` : '';
      el.innerHTML =
        `<div class="bldg-addr">${addr}</div>` +
        `<div class="bldg-meta">` +
          `<span class="tag tag-${cls}">${cls}</span>` +
          `<span class="stories-badge ${storiesClass}">${b.stories_found}F</span>` +
          `<span>${b.rooms.length}r</span>` +
          `<span>${rawCount}w</span>` +
          gapBadge +
        `</div>`;
      el.dataset.search = `${addr} ${b.uuid} ${cls}`.toLowerCase();
      el.dataset.index = i;
      el.addEventListener('click', () => {
        document.querySelectorAll('.bldg-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        requestAnimationFrame(() => loadBuilding(i));
      });
      list.appendChild(el);
    }

    document.getElementById('sidebar-stats').textContent = `${data.length} buildings`;
    resizeRenderer();
    loadBuilding(indices[0]);
    animate();
  });
</script>
</body>
</html>
